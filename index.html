<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iGet Sync Secure Access</title>

<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'SF Pro Display',sans-serif;
}

body{
    background:#020202;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
    position:relative;
}

/* Background */

.bg{
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at top left, rgba(255,255,255,.08), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,255,255,.05), transparent 35%);
    filter:blur(10px);
}

/* Card */

.container{
    width:420px;
    padding:45px 38px;
    border-radius:34px;

    background:rgba(12,12,12,.88);

    border:1px solid rgba(255,255,255,.06);

    backdrop-filter:blur(25px);

    box-shadow:
    0 25px 60px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.05);

    position:relative;
    z-index:2;
    text-align:center;
}

/* Apple Logo */

.logo{
    width:95px;
    height:95px;

    margin:auto;

    border-radius:30px;

    background:
    linear-gradient(145deg,#1c1c1c,#0f0f0f);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:42px;

    margin-bottom:30px;

    border:1px solid rgba(255,255,255,.05);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03),
    0 0 25px rgba(255,255,255,.03);

    animation:float 4s ease-in-out infinite;
}

/* Typing */

.title-box{
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:10px;
}

.typing{
    font-size:44px;
    font-weight:700;
    letter-spacing:-1px;

    white-space:nowrap;
    overflow:hidden;

    border-right:2px solid rgba(255,255,255,.8);

    width:10ch;

    animation:
    typing 2.2s steps(10) infinite alternate,
    blink .7s infinite;
}

/* Description */

.desc{
    color:#9d9d9d;
    font-size:15px;
    line-height:26px;

    margin-bottom:38px;
}

/* Button */

.btn{
    width:100%;
    height:58px;

    border:none;
    border-radius:18px;

    background:
    linear-gradient(to bottom,#ffffff,#dcdcdc);

    color:black;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 10px 20px rgba(255,255,255,.06);
}

.btn:hover{
    transform:translateY(-2px) scale(1.01);
}

/* Status */

.status{
    margin-top:20px;
    font-size:13px;
    color:#666;
    letter-spacing:.5px;
}

/* Popup */

.popup{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(8px);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:5;
}

.popup-box{
    width:350px;

    background:rgba(15,15,15,.95);

    border:1px solid rgba(255,255,255,.06);

    border-radius:30px;

    padding:35px;

    text-align:center;

    animation:show .25s ease;
}

.popup-box h2{
    font-size:28px;
    margin-bottom:14px;
}

.popup-box p{
    color:#9d9d9d;
    font-size:14px;
    line-height:24px;

    margin-bottom:24px;
}

.popup-box button{
    width:100%;
    height:54px;

    border:none;
    border-radius:15px;

    background:white;
    color:black;

    font-weight:700;
    font-size:15px;

    cursor:pointer;
}

/* Animation */

@keyframes typing{
    from{
        width:0;
    }

    to{
        width:10ch;
    }
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes show{
    from{
        opacity:0;
        transform:scale(.92);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="logo"></div>

    <div class="title-box">
        <h1 class="typing">iGet Sync</h1>
    </div>

    <p class="desc">
        Secure download access for premium bypass tools & software.
    </p>

    <button class="btn" onclick="openPopup()">
        Generate Secure Link
    </button>

    <div class="status">
        VERIFIED SERVER • SECURE ACCESS
    </div>

</div>

<div class="popup" id="popup">

    <div class="popup-box">

        <h2>Access Required</h2>

        <p>
            Please contact admin to obtain secure download access for this application.
        </p>

        <button onclick="redirectWA()">
            Contact Admin
        </button>

    </div>

</div>

<script>

function openPopup(){
    document.getElementById("popup").style.display = "flex";
}

function redirectWA(){
    window.location.href = "https://wa.me/6283182014618";
}

</script>

</body>
</html>
