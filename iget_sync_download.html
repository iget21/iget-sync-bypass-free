<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iGet Sync Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0d0d0d;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    width:350px;
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.logo{
    width:80px;
    height:80px;
    background:#1f1f1f;
    border-radius:20px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    margin-bottom:20px;
}

h1{
    font-size:24px;
    margin-bottom:10px;
}

p{
    color:#9c9c9c;
    font-size:14px;
    margin-bottom:25px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    opacity:0.85;
}

.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-box{
    width:320px;
    background:#181818;
    border:1px solid #2d2d2d;
    border-radius:18px;
    padding:25px;
    text-align:center;
    animation:fade 0.3s ease;
}

.popup-box h2{
    margin-bottom:10px;
}

.popup-box p{
    margin-bottom:20px;
}

.popup-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

@keyframes fade{
    from{
        transform:scale(0.9);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo"></div>

    <h1>iGet Sync</h1>

    <p>
        Secure download access for bypass tools & software.
    </p>

    <button class="btn" onclick="openPopup()">
        Generate Download Link
    </button>
</div>

<div class="popup" id="popup">
    <div class="popup-box">
        <h2>Access Required</h2>

        <p>
            Silahkan hubungi admin untuk mendapatkan akses download aplikasi.
        </p>

        <button onclick="redirectWA()">
            Hubungi Admin
        </button>
    </div>
</div>

<script>
function openPopup(){
    document.getElementById("popup").style.display = "flex";
}

function redirectWA(){
    window.location.href = "https://wa.me/6283182014618";
}
</script>

</body>
</html>
